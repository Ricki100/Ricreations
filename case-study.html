<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study | Ricreations</title>
  <meta name="description" content="Case study by Ricardo Chitagu — Ricreations">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1a10b0; --blue-deep: #0d0870; --gold: #f5c518;
      --ink: #11111a; --paper: #f4f2ec; --white: #ffffff;
      --line: rgba(17,17,26,0.14); --line-light: rgba(255,255,255,0.18);
      --muted: rgba(17,17,26,0.62);
      --gutter: clamp(1.1rem, 4.6vw, 4.5rem);
      --max: 92rem; --nav-h: 72px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "Inter", Arial, sans-serif; background: var(--paper); color: var(--ink); overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* NAV */
    .topbar { position: fixed; inset: 0 0 auto; z-index: 20; min-height: var(--nav-h); padding: 18px var(--gutter); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: var(--white); border-bottom: 1px solid transparent; transition: background .35s, color .35s, border-color .35s, min-height .35s, padding .35s; }
    .topbar.is-scrolled { min-height: 58px; padding-top: 12px; padding-bottom: 12px; background: rgba(244,242,236,0.92); border-color: var(--line); color: var(--ink); backdrop-filter: blur(18px); }
    .brand { justify-self: start; font-size: .72rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    .brand span { color: var(--gold); }
    .nav-links { display: flex; justify-content: center; gap: clamp(1.25rem,3vw,2.3rem); list-style: none; font-size: .67rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .nav-links a { position: relative; display: inline-flex; padding: 6px 0; }
    .nav-links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gold); transform: scaleX(0); transform-origin: right; transition: transform .28s; }
    .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }
    .nav-cta { justify-self: end; display: inline-flex; align-items: center; gap: 10px; font-size: .68rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .nav-cta::before { content: ""; width: 34px; height: 1px; background: currentColor; opacity: .45; }

    /* HERO */
    .cs-hero { min-height: 88vh; position: relative; overflow: hidden; display: grid; align-items: end; padding: calc(var(--nav-h) + 3rem) var(--gutter) clamp(2.5rem,6vw,5rem); color: var(--white); }
    .cs-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px) 0 0/25vw 100%, linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/100% 118px; opacity: .5; }
    .cs-hero-bg { position: absolute; inset: 0; z-index: 0; }
    .cs-hero-word { position: absolute; right: -0.1em; bottom: 8%; font-size: clamp(6rem,20vw,20rem); line-height: .8; font-weight: 900; letter-spacing: -.08em; color: rgba(255,255,255,.045); pointer-events: none; z-index: 1; white-space: nowrap; }
    .cs-hero-inner { position: relative; z-index: 2; width: min(100%, var(--max)); margin: 0 auto; }
    .cs-back { display: inline-flex; align-items: center; gap: 10px; font-size: .66rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: clamp(2rem,5vw,4rem); transition: color .2s; }
    .cs-back:hover { color: var(--gold); }
    .cs-back::before { content: "\2190"; font-size: 1rem; }
    .cs-eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: .66rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.25rem; }
    .cs-hero h1 { font-size: clamp(3.5rem,12vw,11rem); line-height: .82; letter-spacing: -.07em; font-weight: 900; text-transform: uppercase; max-width: 14ch; margin-bottom: 2rem; }
    .cs-hero-meta { display: grid; grid-template-columns: repeat(4,1fr); max-width: 680px; border: 1px solid var(--line-light); }
    .cs-hero-meta-item { padding: 1rem 1.25rem; border-right: 1px solid var(--line-light); display: flex; flex-direction: column; gap: 6px; }
    .cs-hero-meta-item:last-child { border-right: 0; }
    .cs-hero-meta-label { font-size: .58rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); }
    .cs-hero-meta-value { font-size: .92rem; font-weight: 700; }

    /* METRICS BAND */
    .metrics-band { background: var(--ink); color: var(--white); padding: clamp(2.5rem,6vw,4.5rem) var(--gutter); }
    .metrics-band-inner { width: min(100%, var(--max)); margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); border-left: 1px solid rgba(255,255,255,.12); border-top: 1px solid rgba(255,255,255,.12); }
    .metric-block { padding: clamp(1.5rem,4vw,2.5rem) clamp(1.25rem,3vw,2rem); border-right: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: .75rem; }
    .metric-block-label { font-size: .62rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.42); }
    .metric-block-value { font-size: clamp(2.4rem,6vw,5rem); font-weight: 900; letter-spacing: -.06em; line-height: .9; color: var(--gold); }
    .metric-block-desc { font-size: .82rem; color: rgba(255,255,255,.55); line-height: 1.55; }

    /* CONTENT */
    .section { padding: clamp(4rem,9vw,7rem) var(--gutter); }
    .section-inner { width: min(100%, var(--max)); margin: 0 auto; }
    .content-grid { display: grid; grid-template-columns: minmax(180px,.32fr) minmax(0,1fr); gap: clamp(2rem,6vw,7rem); padding-top: 1rem; border-top: 1px solid var(--line); margin-bottom: clamp(3rem,7vw,6rem); }
    .content-label { font-size: .66rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--blue); padding-top: 4px; }
    .content-body h2 { font-size: clamp(1.8rem,4vw,3.2rem); letter-spacing: -.05em; line-height: .9; text-transform: uppercase; font-weight: 900; margin-bottom: 1.25rem; }
    .content-body p { font-size: clamp(.95rem,1.4vw,1.1rem); line-height: 1.75; color: var(--muted); max-width: 58rem; margin-bottom: 1rem; }
    .content-body p:last-child { margin-bottom: 0; }

    /* STEPS */
    .steps { margin-top: 1.75rem; border-top: 1px solid var(--line); }
    .step { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 1.25rem; padding: clamp(1.25rem,3vw,2rem) 0; border-bottom: 1px solid var(--line); }
    .step-num { font-size: .68rem; font-weight: 900; letter-spacing: .16em; color: var(--blue); padding-top: 4px; }
    .step h3 { font-size: clamp(1.1rem,2vw,1.55rem); letter-spacing: -.03em; text-transform: uppercase; font-weight: 900; margin-bottom: .5rem; }
    .step p { font-size: .9rem; line-height: 1.65; color: var(--muted); }

    /* TAGS */
    .tags-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .tag { font-size: .6rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line); color: var(--blue); }

    /* ACTIVE BANNER */
    .status-banner { display: flex; align-items: center; gap: 12px; padding: 1rem clamp(1.25rem,3vw,2rem); background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); margin-top: 2.5rem; max-width: 480px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: pulse 2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }
    .status-text { font-size: .68rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }

    /* ── CREATIVE SHOWCASE ────────────────────────────────────────────────── */
    .creatives-section { background: var(--ink); color: var(--white); padding: clamp(4rem,9vw,7rem) var(--gutter); }
    .creatives-inner { width: min(100%, var(--max)); margin: 0 auto; }
    .creatives-head { border-top: 1px solid rgba(255,255,255,.14); padding-top: 1rem; margin-bottom: clamp(2rem,5vw,4rem); display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .creatives-kicker { font-size: .66rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: .6rem; }
    .creatives-head h2 { font-size: clamp(2rem,5vw,4.5rem); letter-spacing: -.06em; line-height: .86; text-transform: uppercase; font-weight: 900; }
    .creative-count { font-size: .66rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.35); }
    .creative-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(.75rem,2vw,1.25rem); }
    .creative-item { position: relative; overflow: hidden; background: rgba(255,255,255,.06); cursor: pointer; }
    .creative-item.featured { grid-column: span 2; }
    .creative-item img,
    .creative-item video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.7,.1,1); }
    .creative-item:hover img,
    .creative-item:hover video { transform: scale(1.04); }
    .creative-aspect { aspect-ratio: 4/3; overflow: hidden; }
    .creative-item.featured .creative-aspect { aspect-ratio: 16/9; }
    .creative-caption { padding: .75rem 1rem; font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.5); border-top: 1px solid rgba(255,255,255,.1); }
    .creative-type-badge { position: absolute; top: .75rem; left: .75rem; padding: 3px 8px; font-size: .56rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; background: var(--gold); color: var(--ink); z-index: 2; }
    .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); transition: background .25s; z-index: 3; }
    .creative-item:hover .play-overlay { background: rgba(0,0,0,.55); }
    .play-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; transition: transform .25s; }
    .creative-item:hover .play-btn { transform: scale(1.1); }
    .play-btn svg { width: 20px; height: 20px; fill: var(--ink); margin-left: 3px; }
    .no-creatives { padding: clamp(2rem,5vw,4rem); text-align: center; border: 1px dashed rgba(255,255,255,.18); }
    .no-creatives p { font-size: .9rem; color: rgba(255,255,255,.4); line-height: 1.6; }
    .no-creatives strong { color: var(--gold); display: block; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .75rem; }

    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.94); align-items: center; justify-content: center; padding: 2rem; }
    .lightbox.open { display: flex; }
    .lightbox-inner { position: relative; max-width: 90vw; max-height: 90vh; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .lightbox-media { max-width: 100%; max-height: 80vh; width: 100%; }
    .lightbox-media img { max-width: 100%; max-height: 80vh; object-fit: contain; display: block; margin: 0 auto; }
    .lightbox-media iframe { width: min(900px,90vw); height: min(506px,50vw); border: none; display: block; }
    .lightbox-media video { max-width: 100%; max-height: 80vh; display: block; margin: 0 auto; }
    .lightbox-caption { margin-top: 1rem; font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); text-align: center; }
    .lightbox-close { position: absolute; top: -2.5rem; right: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: rgba(255,255,255,.6); cursor: pointer; transition: color .2s; }
    .lightbox-close:hover { color: var(--gold); }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); display: flex; justify-content: space-between; width: calc(100% + 6rem); pointer-events: none; }
    .lightbox-nav button { pointer-events: all; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: var(--white); font-size: 1.2rem; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; }
    .lightbox-nav button:hover { background: var(--gold); color: var(--ink); }

    /* RESULTS */
    .results-section { background: var(--blue); color: var(--white); padding: clamp(4rem,9vw,7rem) var(--gutter); }
    .results-inner { width: min(100%, var(--max)); margin: 0 auto; }
    .results-head { border-top: 1px solid var(--line-light); padding-top: 1rem; margin-bottom: clamp(2.5rem,6vw,5rem); }
    .results-kicker { font-size: .66rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: .75rem; }
    .results-head h2 { font-size: clamp(2.5rem,7vw,6.5rem); letter-spacing: -.07em; line-height: .85; text-transform: uppercase; font-weight: 900; max-width: 12ch; }
    .results-grid { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid var(--line-light); border-left: 1px solid var(--line-light); }
    .result-item { padding: clamp(1.5rem,4vw,2.5rem); border-right: 1px solid var(--line-light); border-bottom: 1px solid var(--line-light); }
    .result-label { font-size: .62rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: .75rem; }
    .result-value { font-size: clamp(2rem,5vw,4.2rem); font-weight: 900; letter-spacing: -.06em; line-height: .88; color: var(--gold); margin-bottom: .5rem; }
    .result-note { font-size: .82rem; color: rgba(255,255,255,.6); line-height: 1.5; }

    /* NEXT CASE STUDY */
    .next-cs { background: var(--ink); color: var(--white); padding: clamp(3rem,7vw,5rem) var(--gutter); }
    .next-cs-inner { width: min(100%, var(--max)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
    .next-label { font-size: .64rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: .75rem; }
    .next-title { font-size: clamp(1.8rem,4vw,3.5rem); font-weight: 900; letter-spacing: -.05em; text-transform: uppercase; }
    .next-arrow { display: inline-flex; align-items: center; gap: 12px; font-size: .7rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(245,197,24,.35); padding: 1rem 1.5rem; transition: background .25s, color .25s; flex-shrink: 0; }
    .next-arrow:hover { background: var(--gold); color: var(--ink); }

    /* FOOTER */
    .footer { padding: 1.25rem var(--gutter); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--line); font-size: .67rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(17,17,26,.52); }
    .footer-links { display: flex; gap: 1.25rem; flex-wrap: wrap; }

    /* REVEAL */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s, transform .7s cubic-bezier(.2,.7,.1,1); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .cs-hero-meta { grid-template-columns: repeat(2,1fr); }
      .metrics-band-inner { grid-template-columns: repeat(2,1fr); }
      .results-grid { grid-template-columns: repeat(2,1fr); }
      .content-grid { grid-template-columns: 1fr; gap: 1rem; }
      .creative-grid { grid-template-columns: repeat(2,1fr); }
      .creative-item.featured { grid-column: span 2; }
      .lightbox-nav { width: calc(100% + 2rem); }
    }
    @media (max-width: 600px) {
      .topbar { grid-template-columns: 1fr; justify-items: start; gap: .65rem; }
      .brand { display: none; }
      .nav-links { justify-content: flex-start; gap: 1.1rem; width: 100%; overflow-x: auto; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-cta { display: none; }
      .cs-hero-meta { grid-template-columns: 1fr 1fr; }
      .metrics-band-inner { grid-template-columns: 1fr 1fr; }
      .results-grid { grid-template-columns: 1fr; }
      .creative-grid { grid-template-columns: 1fr; }
      .creative-item.featured { grid-column: span 1; }
      .lightbox-nav { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar" data-nav>
    <a class="brand" href="index.html">Ric<span>reations</span></a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html#intro">About</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#projects">Work</a></li>
        <li><a href="index.html#testimonials">Reviews</a></li>
      </ul>
    </nav>
    <a class="nav-cta" href="mailto:rchitagu@gmail.com">Start a brief</a>
  </header>

  <!-- All sections rendered by JS -->
  <div id="cs-root"></div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lb-close" aria-label="Close">&times;</button>
      <div class="lightbox-nav">
        <button id="lb-prev" aria-label="Previous">&larr;</button>
        <button id="lb-next" aria-label="Next">&rarr;</button>
      </div>
      <div class="lightbox-media" id="lb-media"></div>
      <p class="lightbox-caption" id="lb-caption"></p>
    </div>
  </div>

  <footer class="footer">
    <p>Ricreations / Ricardo Chitagu</p>
    <div class="footer-links">
      <a href="https://www.behance.net/rchitagu5164" target="_blank" rel="noopener">Behance</a>
      <a href="https://www.tiktok.com/@rickichitagu" target="_blank" rel="noopener">TikTok</a>
      <a href="https://www.linkedin.com/in/ricardo-c-4a993895/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

  <script src="assets/js/case-studies.js"></script>
  <script>
  (() => {
    // ── Get case study ID from URL ──────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const cs = id && CASE_STUDIES[id];

    if (!cs) {
      document.getElementById('cs-root').innerHTML = `
        <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;">
          <div>
            <p style="font-size:.7rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:1rem;">404</p>
            <h1 style="font-size:3rem;font-weight:900;letter-spacing:-.06em;text-transform:uppercase;margin-bottom:1.5rem;">Case study not found</h1>
            <a href="index.html#projects" style="font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);">&larr; Back to all work</a>
          </div>
        </div>`;
      return;
    }

    // ── Update page title ───────────────────────────────────────────────────
    document.title = `${cs.client} — Case Study | Ricreations`;

    // ── Helpers ─────────────────────────────────────────────────────────────
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    function renderMeta(items) {
      return items.map(m => `
        <div class="cs-hero-meta-item">
          <span class="cs-hero-meta-label">${esc(m.label)}</span>
          <span class="cs-hero-meta-value">${esc(m.value)}</span>
        </div>`).join('');
    }

    function renderKeyMetrics(items) {
      return items.map(m => `
        <div class="metric-block reveal">
          <span class="metric-block-label">${esc(m.label)}</span>
          <span class="metric-block-value" ${m.color ? `style="color:${m.color}"` : ''}>${esc(m.value)}</span>
          <span class="metric-block-desc">${esc(m.desc)}</span>
        </div>`).join('');
    }

    function renderSteps(steps) {
      return steps.map(s => `
        <div class="step">
          <span class="step-num">${esc(s.num)}</span>
          <div>
            <h3>${esc(s.title)}</h3>
            <p>${esc(s.body)}</p>
          </div>
        </div>`).join('');
    }

    function renderResults(items) {
      return items.map(r => `
        <div class="result-item reveal">
          <p class="result-label">${esc(r.label)}</p>
          <p class="result-value" ${r.color ? `style="color:${r.color}"` : ''}>${esc(r.value)}</p>
          <p class="result-note">${esc(r.note)}</p>
        </div>`).join('');
    }

    // ── CREATIVES ───────────────────────────────────────────────────────────
    function getYoutubeId(src) {
      const m = src.match(/(?:youtu\.be\/|watch\?v=|embed\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : src;
    }
    function getVimeoId(src) {
      const m = src.match(/(?:vimeo\.com\/)(\d+)/);
      return m ? m[1] : src;
    }
    function getThumb(item) {
      if (item.type === 'youtube') return `https://img.youtube.com/vi/${getYoutubeId(item.src)}/hqdefault.jpg`;
      if (item.type === 'vimeo') return item.thumb || '';
      return item.src;
    }
    function isVideo(item) {
      return item.type === 'video' || item.type === 'youtube' || item.type === 'vimeo';
    }
    function typeBadge(t) {
      const labels = { image:'Photo', gif:'GIF', video:'Video', youtube:'Video', vimeo:'Video' };
      return labels[t] || t;
    }

    function renderCreatives(creatives) {
      if (!creatives || creatives.length === 0) {
        return `<div class="no-creatives">
          <strong>Creatives coming soon</strong>
          <p>Campaign creative assets — static ads, GIFs and video — will be added here shortly.</p>
        </div>`;
      }
      const items = creatives.map((c, i) => {
        const featured = c.featured ? ' featured' : '';
        const badge = `<span class="creative-type-badge">${typeBadge(c.type)}</span>`;
        let media = '';

        if (c.type === 'image' || c.type === 'gif') {
          media = `<div class="creative-aspect"><img src="${esc(c.src)}" alt="${esc(c.caption || '')}" loading="lazy"></div>`;
        } else if (c.type === 'video') {
          media = `<div class="creative-aspect">
            <video src="${esc(c.src)}" muted preload="metadata" loop></video>
            <div class="play-overlay"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          </div>`;
        } else if (c.type === 'youtube' || c.type === 'vimeo') {
          const thumb = getThumb(c);
          media = `<div class="creative-aspect" style="position:relative;background:#000;">
            ${thumb ? `<img src="${esc(thumb)}" alt="${esc(c.caption || '')}" style="width:100%;height:100%;object-fit:cover;opacity:.8;">` : ''}
            <div class="play-overlay"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          </div>`;
        }

        return `<div class="creative-item${featured} reveal" data-index="${i}" role="button" tabindex="0" aria-label="View ${esc(c.caption || 'creative')}">
          ${badge}
          ${media}
          ${c.caption ? `<div class="creative-caption">${esc(c.caption)}</div>` : ''}
        </div>`;
      }).join('');

      return `<div class="creative-grid">${items}</div>`;
    }

    // ── BUILD HTML ──────────────────────────────────────────────────────────
    const html = `
      <!-- HERO -->
      <section class="cs-hero">
        <div class="cs-hero-bg" style="background:${cs.coverColor};"></div>
        <div class="cs-hero-word">${esc(cs.heroWord)}</div>
        <div class="cs-hero-inner">
          <a class="cs-back" href="index.html#projects">All case studies</a>
          <p class="cs-eyebrow">Case Study &mdash; ${esc(cs.number)}</p>
          <h1>${cs.client.replace('&', '&amp;')}</h1>
          <div class="cs-hero-meta">${renderMeta(cs.meta)}</div>
        </div>
      </section>

      <!-- METRICS BAND -->
      <div class="metrics-band">
        <div class="metrics-band-inner">${renderKeyMetrics(cs.keyMetrics)}</div>
      </div>

      <main>
        <!-- BRIEF -->
        <section class="section">
          <div class="section-inner">
            <div class="content-grid reveal">
              <span class="content-label">The Brief</span>
              <div class="content-body">
                <h2>${esc(cs.brief.heading)}</h2>
                ${cs.brief.body.map(p => `<p>${esc(p)}</p>`).join('')}
                <div class="tags-row">${cs.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
              </div>
            </div>

            <!-- STRATEGY -->
            <div class="content-grid reveal">
              <span class="content-label">Strategy</span>
              <div class="content-body">
                <h2>${esc(cs.strategy.heading)}</h2>
                <p>${esc(cs.strategy.intro)}</p>
                <div class="steps">${renderSteps(cs.strategy.steps)}</div>
              </div>
            </div>

            <!-- EXECUTION -->
            <div class="content-grid reveal">
              <span class="content-label">Execution</span>
              <div class="content-body">
                <h2>${esc(cs.execution.heading)}</h2>
                ${cs.execution.body.map(p => `<p>${esc(p)}</p>`).join('')}
                ${cs.execution.isActive ? `<div class="status-banner"><span class="status-dot"></span><span class="status-text">Campaign is currently live and generating results</span></div>` : ''}
              </div>
            </div>
          </div>
        </section>

        <!-- CREATIVE SHOWCASE -->
        <section class="creatives-section">
          <div class="creatives-inner">
            <div class="creatives-head reveal">
              <div>
                <p class="creatives-kicker">Creative Showcase</p>
                <h2>Campaign Creatives</h2>
              </div>
              ${cs.creatives && cs.creatives.length ? `<span class="creative-count">${cs.creatives.length} asset${cs.creatives.length !== 1 ? 's' : ''}</span>` : ''}
            </div>
            ${renderCreatives(cs.creatives)}
          </div>
        </section>

        <!-- RESULTS -->
        <section class="results-section">
          <div class="results-inner">
            <div class="results-head reveal">
              <p class="results-kicker">Results</p>
              <h2>Numbers that speak for themselves</h2>
            </div>
            <div class="results-grid">${renderResults(cs.results)}</div>
          </div>
        </section>
      </main>

      <!-- NEXT -->
      <div class="next-cs">
        <div class="next-cs-inner">
          <div>
            <p class="next-label">Next case study</p>
            <p class="next-title">${esc(cs.nextLabel)}</p>
          </div>
          <a class="next-arrow" href="case-study.html?id=${esc(cs.next)}">View case study &rarr;</a>
        </div>
      </div>
    `;

    document.getElementById('cs-root').innerHTML = html;

    // ── LIGHTBOX ────────────────────────────────────────────────────────────
    const lb = document.getElementById('lightbox');
    const lbMedia = document.getElementById('lb-media');
    const lbCaption = document.getElementById('lb-caption');
    const lbClose = document.getElementById('lb-close');
    const lbPrev = document.getElementById('lb-prev');
    const lbNext = document.getElementById('lb-next');
    let lbIndex = 0;
    const creatives = cs.creatives || [];

    function openLightbox(index) {
      if (!creatives.length) return;
      lbIndex = index;
      showLightboxItem();
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbMedia.innerHTML = '';
    }
    function showLightboxItem() {
      const c = creatives[lbIndex];
      lbCaption.textContent = c.caption || '';
      let mediaHtml = '';
      if (c.type === 'image') {
        mediaHtml = `<img src="${esc(c.src)}" alt="${esc(c.caption || '')}">`;
      } else if (c.type === 'gif') {
        mediaHtml = `<img src="${esc(c.src)}" alt="${esc(c.caption || '')}">`;
      } else if (c.type === 'video') {
        mediaHtml = `<video src="${esc(c.src)}" controls autoplay style="max-width:100%;max-height:80vh;"></video>`;
      } else if (c.type === 'youtube') {
        const vid = getYoutubeId(c.src);
        mediaHtml = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
      } else if (c.type === 'vimeo') {
        const vid = getVimeoId(c.src);
        mediaHtml = `<iframe src="https://player.vimeo.com/video/${vid}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
      }
      lbMedia.innerHTML = mediaHtml;
      lbPrev.style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
      lbNext.style.visibility = lbIndex < creatives.length - 1 ? 'visible' : 'hidden';
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; showLightboxItem(); } });
    lbNext.addEventListener('click', () => { if (lbIndex < creatives.length - 1) { lbIndex++; showLightboxItem(); } });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; showLightboxItem(); }
      if (e.key === 'ArrowRight' && lbIndex < creatives.length - 1) { lbIndex++; showLightboxItem(); }
    });

    // Wire up creative item clicks after render
    setTimeout(() => {
      document.querySelectorAll('.creative-item').forEach(el => {
        el.addEventListener('click', () => openLightbox(parseInt(el.dataset.index)));
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openLightbox(parseInt(el.dataset.index)); });
      });
    }, 0);

    // ── NAV SCROLL ──────────────────────────────────────────────────────────
    const nav = document.querySelector('[data-nav]');
    const setNav = () => nav.classList.toggle('is-scrolled', window.scrollY > 24);
    setNav();
    window.addEventListener('scroll', setNav, { passive: true });

    // ── REVEAL ──────────────────────────────────────────────────────────────
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('.reveal').forEach((el, i) => {
      el.style.transitionDelay = `${Math.min(i % 4, 3) * 65}ms`;
      observer.observe(el);
    });

  })();
  </script>
</body>
</html>
