name: Build CMS content
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/build-cms-content.js', 'admin/config.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-cms-content.js
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/cms-content.json
          git diff --cached --quiet || git commit -m "Build CMS content [skip ci]"
          git push
